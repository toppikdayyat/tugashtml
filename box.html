<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kartu Produk</title>
  <link rel="stylesheet" href="box.css">
</head>
<body>

  <div class="product-card">
    <img src="ramen.jpg" alt="Ramen Ayam Shoyu" class="product-image">
    <p class="product-name">Ramen Ayam Shoyu</p>
    <p class="product-price">Rp 35.000</p>
  </div>

  <div class="product-card">
    <img src="nasgor.jpg" alt="Nasi Goreng Spesial" class="product-image">
    <p class="product-name">Nasi Nasgor Goreng Spesial</p>
    <p class="product-price">Rp 28.000</p>
  </div>

  <div class="product-card">
    <img src="dimsum.jpg" alt="Dimsum Ayam" class="product-image">
    <p class="product-name">Dimsum Ayam (5 pcs)</p>
    <p class="product-price">Rp 20.000</p>
  </div>

</body>
</html>
